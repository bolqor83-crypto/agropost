# Render Blueprint — АгроПост.
# Связка: agropost-web (Static Site, не спит) + agropost-api (Web Service, free tier).
# База — Neon (не Render Postgres: free-вариант удаляет данные через 30 дней).
# Порядок деплоя см. в README.md (раздел «Деплой»).

services:
  - type: static
    name: agropost-web
    rootDir: apps/web
    buildCommand: npm install --include=dev && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Адрес API вшивается в статику на сборке (apps/web/src/api/client.ts)
      - key: VITE_API_URL
        value: https://agropost-api.onrender.com/api

  - type: web
    name: agropost-api
    runtime: node
    plan: free
    rootDir: apps/server
    buildCommand: npm install --include=dev && npm run build
    # Миграции применяются при каждом деплое (идемпотентно), затем старт
    startCommand: npx prisma migrate deploy && npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      # Этап 5.1: вход владельца (Argon2id-хеш; пароль не в открытом виде).
      # Хеш: cd apps/server && bun run hash-password
      - key: OWNER_LOGIN
        value: agropost
      - key: OWNER_PASSWORD_HASH
        sync: false
      # Этап 5.1: доверенные origin для CORS (через запятую).
      - key: TRUSTED_ORIGINS
        value: https://agropost-web.onrender.com
      # Этап 5.1: парсер цен — адрес сервиса и внутренний секрет
      # сервер-сервер (Node → Python /run). Без них /api/parser/*
      # честно отвечает «Парсер не настроен».
      - key: PARSER_URL
        sync: false
      - key: PARSER_SECRET
        sync: false
      - key: OPENROUTER_KEY
        sync: false
      # AI-слой (этап 3.0): GLM через Z.AI — основной провайдер,
      # OpenRouter — резервный. Ключи только здесь, на бэкенде.
      - key: AI_PROVIDER
        value: glm
      - key: GLM_API_KEY
        sync: false
      - key: GLM_BASE_URL
        value: https://api.z.ai/api/paas/v4
      - key: GLM_MODEL_FLASH
        value: glm-5.3-flash
      - key: GLM_MODEL_PRO
        value: glm-5.3
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: openai/gpt-4o-mini
      # Этап 6: R2 включается автоматически, когда все 5 значений заданы.
      # R2_CONFIGURED — необязательный ручной переключатель (true/false);
      # без R2 файлы хранятся в базе (base64), приложение работает.
      - key: R2_ENDPOINT
        sync: false
      - key: R2_BUCKET
        value: agropost-media
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_PUBLIC_URL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      # Этап 5.2: id Telegram-аккаунта владельца (бот шлёт ему уведомления
      # о лидах/ошибках; getMe не выдаёт его — узнайте у @userinfobot).
      - key: TELEGRAM_USER_ID
        sync: false
      # ЭТАП 9: фиды площадок (YML/Авито) — публичный токен доступа.
      # Можно задать здесь или в UI («Настройки» → «Фиды»); env приоритетнее.
      - key: FEED_TOKEN
        sync: false
      # ЭТАП «СЕКРЕТЫ»: ключ шифрования секретов в AppSetting
      # (AES-256-GCM). Сгенерируйте: openssl rand -hex 32. Без него
      # экран «Переменные» показывает предупреждение, env работает.
      - key: SECRETS_ENCRYPTION_KEY
        sync: false

  # Этап 5.1 — сервис парсера цен (Python). ВЫКЛЮЧЕН по умолчанию:
  # раскомментируйте блок целиком и задайте PARSER_URL для agropost-api
  # (https://agropost-parser.onrender.com) + одинаковый PARSER_SECRET
  # в обоих сервисах. MTProto-сбор публичных каналов ТГ выключен
  # (TG_COLLECT_ENABLED=0) — см. services/parser/README.md.
  #
  # - type: web
  #   name: agropost-parser
  #   runtime: python
  #   plan: free
  #   rootDir: services/parser
  #   buildCommand: pip install -r requirements.txt
  #   startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
  #   healthCheckPath: /health
