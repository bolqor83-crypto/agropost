  #       sync: false
  #     - key: TG_SESSION
  #       sync: false
  #     - key: TG_CHANNELS
  #       value: selhoz032,RUSSIAN_WHOLESALER
  #     - key: AGROSERVER_QUERIES
  #       value: люцерна,эспарцет,суданка,грецкий орех
